# Local Upstash-compatible REST endpoint for tests and offline dev:
# Redis plus serverless-redis-http (SRH), which speaks the Upstash REST API.
#   docker compose up -d
#   UPSTASH_REDIS_REST_URL=http://localhost:8079 UPSTASH_REDIS_REST_TOKEN=local_token pnpm test
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: local_token
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      - redis
